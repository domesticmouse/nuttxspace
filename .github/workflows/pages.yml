name: Deploy MkDocs Documentation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-mkdocs-material-${{ hashFiles('mkdocs.yml') }}
          restore-keys: |
            ${{ runner.os }}-mkdocs-material-

      - name: Install MkDocs Material
        run: pip install mkdocs-material markdown-it-py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            slides/package-lock.json
            slides-skills-three-ways/package-lock.json

      - name: Install Slidev dependencies
        working-directory: slides
        run: npm ci

      - name: Build Slidev presentation deck
        working-directory: slides
        run: npm run build

      - name: Install Skills Three Ways Slidev dependencies
        working-directory: slides-skills-three-ways
        run: npm ci

      - name: Build Skills Three Ways Slidev deck
        working-directory: slides-skills-three-ways
        run: npm run build

      - name: Build site
        run: mkdocs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
