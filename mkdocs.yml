site_name: NuttX Workspace (nuttxspace)
site_description: Out-of-tree Apache NuttX firmware for XIAO RP2350, EGM design & review artifacts, tutorials, and exported session traces.
site_url: https://domesticmouse.github.io/nuttxspace/
repo_url: https://github.com/domesticmouse/nuttxspace
repo_name: domesticmouse/nuttxspace
docs_dir: docs

hooks:
  - hooks/github_alerts.py

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Tutorials:
      - "From Zero to xiao-rp2350-bargraph": tutorials/xiao-rp2350-bargraph.md
      - "Replicating the NuttX EGM Experiment": tutorials/egm-replication-tutorial.md
  - Designs & Specs:
      - "Design Spec: xiao-rp2350-bargraph": designs/xiao-rp2350-bargraph.md
      - "Concepts Brief": designs/concepts_brief.md
      - "Initial Design Draft": designs/design_draft.md
      - "Build Prerequisites (TODO)": designs/TODO.md
  - EGM Review Reports:
